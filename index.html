<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Signal — IPTV Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  :root{
    --bg:#0f0d1a;
    --surface:#171330;
    --surface-2:#211c42;
    --border:#2c2657;
    --text:#f2eefc;
    --text-dim:#a49dc7;
    --accent:#7c5cfc;
    --accent-soft:rgba(124,92,252,0.16);
    --live:#ff6f5e;
    --ok:#4fd1a5;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand,.channel-name,.section-title{
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  ::selection{background:var(--accent-soft);}

  /* Background texture: faint broadcast scanlines, static, no motion */
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,92,252,0.15), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(255,111,94,0.08), transparent 40%);
    pointer-events:none;
    z-index:0;
  }

  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px 100px;}

  /* Header */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(15,13,26,0.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1100px;margin:0 auto;
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.05rem;letter-spacing:0.2px;flex-shrink:0;}
  .brand-mark{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),#5236c9);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  .brand-mark svg{width:14px;height:14px;}
  .search-wrap{position:relative;flex:1;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.5;width:16px;height:16px;}
  #search{
    width:100%;background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:999px;padding:9px 14px 9px 34px;
    font-size:0.9rem;font-family:inherit;outline:none;
  }
  #search:focus{border-color:var(--accent);}
  #search::placeholder{color:var(--text-dim);}
  .icon-btn{
    background:var(--surface);border:1px solid var(--border);
    color:var(--text);width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    cursor:pointer;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:active{transform:scale(0.94);}

  /* Player */
  .player-shell{margin-top:16px;}
  .player-frame{
    position:relative;width:100%;aspect-ratio:16/9;
    background:#000;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--border);
  }
  video{width:100%;height:100%;object-fit:contain;background:#000;}
  .player-empty{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;padding:20px;color:var(--text-dim);
  }
  .player-empty .bars{display:flex;gap:4px;align-items:flex-end;height:26px;}
  .player-empty .bars span{width:4px;background:var(--accent);border-radius:2px;opacity:0.55;}
  .player-empty .bars span:nth-child(1){height:40%;}
  .player-empty .bars span:nth-child(2){height:100%;}
  .player-empty .bars span:nth-child(3){height:65%;}
  .player-empty .bars span:nth-child(4){height:85%;}
  .player-empty .bars span:nth-child(5){height:30%;}
  .player-empty p{margin:0;font-size:0.88rem;}

  .status-overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:rgba(10,9,20,0.72);backdrop-filter:blur(2px);text-align:center;padding:24px;
  }
  .spinner{
    width:30px;height:30px;border-radius:50%;
    border:3px solid rgba(255,255,255,0.15);border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .status-overlay .msg{font-size:0.85rem;color:var(--text-dim);}
  .status-overlay .err-title{font-weight:600;font-size:0.95rem;}
  .retry-btn{
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:9px 18px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .retry-btn:active{transform:scale(0.96);}

  .now-playing{
    display:flex;align-items:center;gap:10px;margin-top:12px;
  }
  .now-playing img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .now-playing .info{min-width:0;}
  .now-playing .name{font-weight:600;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .now-playing .group{font-size:0.78rem;color:var(--text-dim);}
  .live-tag{
    display:inline-flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;
    background:rgba(255,111,94,0.12);color:var(--live);border-radius:999px;
    padding:4px 10px;font-size:0.72rem;font-weight:600;
  }
  .live-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--live);}

  /* Category pills */
  .categories{
    display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;
    scrollbar-width:none;
  }
  .categories::-webkit-scrollbar{display:none;}
  .pill{
    flex-shrink:0;background:var(--surface);border:1px solid var(--border);
    color:var(--text-dim);padding:7px 15px;border-radius:999px;font-size:0.82rem;
    font-weight:500;cursor:pointer;white-space:nowrap;
  }
  .pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .section-title{font-size:0.95rem;font-weight:600;margin:14px 0 10px;color:var(--text-dim);}

  /* Channel grid */
  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  }
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
    transition:border-color 0.15s;
  }
  .card.playing{border-color:var(--accent);background:var(--surface-2);}
  .card:active{transform:scale(0.98);}
  .card .logo{
    width:100%;aspect-ratio:1.6;border-radius:8px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .card .logo img{width:100%;height:100%;object-fit:contain;padding:8px;}
  .card .logo .fallback{font-size:1.1rem;font-weight:700;color:var(--text-dim);}
  .channel-name{font-size:0.82rem;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-dim);
  }
  .empty-state h2{color:var(--text);font-size:1.15rem;margin:14px 0 6px;}
  .empty-state p{font-size:0.88rem;margin:0 0 18px;}
  .cta-btn{
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:11px 22px;font-weight:600;font-size:0.9rem;cursor:pointer;font-family:inherit;
  }

  /* Floating add button */
  .fab{
    position:fixed;bottom:22px;right:22px;z-index:30;
    width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(124,92,252,0.4);cursor:pointer;
  }
  .fab svg{width:22px;height:22px;}
  .fab:active{transform:scale(0.94);}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(8,7,16,0.7);backdrop-filter:blur(3px);
    z-index:40;display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:600px){.modal-backdrop{align-items:center;}}
  .modal{
    width:100%;max-width:480px;background:var(--surface);
    border:1px solid var(--border);border-radius:20px 20px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  }
  @media(min-width:600px){.modal{border-radius:18px;}}
  .modal h3{margin:0 0 4px;font-size:1.1rem;}
  .modal .sub{color:var(--text-dim);font-size:0.85rem;margin:0 0 18px;}
  .tabs{display:flex;gap:6px;background:var(--bg);border-radius:11px;padding:4px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;color:var(--text-dim);}
  .tab.active{background:var(--surface-2);color:var(--text);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:6px;}
  .field input, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:11px 12px;font-size:0.9rem;
    font-family:inherit;outline:none;resize:vertical;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-ghost{
    flex:1;background:transparent;border:1px solid var(--border);color:var(--text-dim);
    border-radius:11px;padding:12px;font-weight:600;font-size:0.88rem;cursor:pointer;font-family:inherit;
  }
  .btn-primary{
    flex:1;background:var(--accent);border:none;color:#fff;
    border-radius:11px;padding:12px;font-weight:600;font-size:0.88rem;cursor:pointer;font-family:inherit;
  }
  .modal-error{color:var(--live);font-size:0.8rem;margin-top:-6px;margin-bottom:10px;min-height:1em;}
  .playlist-list{margin-top:4px;max-height:180px;overflow-y:auto;}
  .playlist-row{
    display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);
  }
  .playlist-row:last-child{border-bottom:none;}
  .playlist-row .pname{flex:1;font-size:0.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .playlist-row .pcount{font-size:0.75rem;color:var(--text-dim);}
  .del-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;}
  .del-btn svg{width:15px;height:15px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v4M8 5l1.5 3.5M16 5l-1.5 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><rect x="3" y="9" width="18" height="12" rx="3" stroke="#fff" stroke-width="2"/></svg>
      </div>
      <span>Signal</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Search channels" />
    </div>
    <button class="icon-btn" id="manageBtn" aria-label="Manage playlists">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="app">

  <div class="player-shell">
    <div class="player-frame" id="playerFrame">
      <video id="video" playsinline webkit-playsinline></video>
      <div class="player-empty" id="playerEmpty">
        <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
        <p>Pick a channel below to start watching</p>
      </div>
      <div class="status-overlay hidden" id="statusOverlay">
        <div id="statusSpinner" class="spinner"></div>
        <div id="statusErrIcon" class="hidden" style="font-size:28px;">⚠️</div>
        <div class="err-title hidden" id="statusTitle"></div>
        <div class="msg" id="statusMsg">Connecting to stream…</div>
        <button class="retry-btn hidden" id="retryBtn">Try again</button>
      </div>
    </div>
    <div class="now-playing hidden" id="nowPlaying">
      <img id="npLogo" src="" alt="" />
      <div class="info">
        <div class="name" id="npName">—</div>
        <div class="group" id="npGroup">—</div>
      </div>
      <div class="live-tag"><span class="dot"></span>LIVE</div>
    </div>
  </div>

  <div class="categories hidden" id="categories"></div>

  <div id="mainContent">
    <div class="empty-state" id="globalEmpty">
      <div class="bars" style="justify-content:center;display:flex;gap:4px;height:30px;margin:0 auto;">
        <span style="width:4px;height:40%;background:var(--accent);border-radius:2px;display:inline-block;"></span>
        <span style="width:4px;height:100%;background:var(--accent);border-radius:2px;display:inline-block;"></span>
        <span style="width:4px;height:65%;background:var(--accent);border-radius:2px;display:inline-block;"></span>
      </div>
      <h2>No playlist yet</h2>
      <p>Add an M3U/M3U8 playlist link, or paste a playlist's contents,<br/>to load your channels.</p>
      <button class="cta-btn" id="emptyAddBtn">Add a playlist</button>
    </div>
    <div id="channelSection" class="hidden">
      <div class="section-title" id="sectionTitle">All channels</div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

</div>

<button class="fab hidden" id="fab" aria-label="Add playlist">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
</button>

<!-- Add / manage playlist modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalHeading">Add a playlist</h3>
    <p class="sub">Load channels from a playlist URL or pasted text.</p>

    <div class="tabs">
      <div class="tab active" data-tab="url">From URL</div>
      <div class="tab" data-tab="paste">Paste M3U</div>
      <div class="tab" data-tab="manage">My playlists</div>
    </div>

    <div id="tabUrl">
      <div class="field">
        <label>Playlist name</label>
        <input id="urlName" type="text" placeholder="e.g. My IPTV list" />
      </div>
      <div class="field">
        <label>M3U / M3U8 link</label>
        <input id="urlLink" type="text" placeholder="https://example.com/playlist.m3u8" />
      </div>
      <div class="modal-error" id="urlError"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelUrl">Cancel</button>
        <button class="btn-primary" id="saveUrl">Load playlist</button>
      </div>
    </div>

    <div id="tabPaste" class="hidden">
      <div class="field">
        <label>Playlist name</label>
        <input id="pasteName" type="text" placeholder="e.g. My IPTV list" />
      </div>
      <div class="field">
        <label>Playlist contents (#EXTM3U ...)</label>
        <textarea id="pasteText" rows="6" placeholder="#EXTM3U&#10;#EXTINF:-1,Channel Name&#10;https://.../stream.m3u8"></textarea>
      </div>
      <div class="modal-error" id="pasteError"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelPaste">Cancel</button>
        <button class="btn-primary" id="savePaste">Load playlist</button>
      </div>
    </div>

    <div id="tabManage" class="hidden">
      <div class="playlist-list" id="playlistList"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="closeManage">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "signal_playlists_v1";
  const PROXY = "/api/proxy?url=";

  let playlists = loadPlaylists();      // [{id,name,channels:[...]}, ...]
  let allChannels = [];                 // flattened, tagged with playlistId
  let activeGroup = "All";
  let currentChannel = null;
  let hls = null;
  let retryCount = 0;
  const MAX_RETRIES = 2;

  // ---------- Storage ----------
  function loadPlaylists(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function savePlaylists(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(playlists));
  }

  // ---------- M3U parsing ----------
  function parseM3U(text, playlistId, playlistName){
    const lines = text.split(/\r?\n/);
    const channels = [];
    let pending = null;

    for(let i=0;i<lines.length;i++){
      const line = lines[i].trim();
      if(!line) continue;

      if(line.startsWith("#EXTINF")){
        const nameMatch = line.match(/,(.*)$/);
        const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
        const groupMatch = line.match(/group-title="([^"]*)"/i);
        pending = {
          name: nameMatch ? nameMatch[1].trim() : "Unnamed channel",
          logo: logoMatch ? logoMatch[1] : "",
          group: groupMatch && groupMatch[1] ? groupMatch[1] : "General"
        };
      } else if(!line.startsWith("#")){
        if(pending){
          channels.push({
            id: playlistId + "_" + channels.length,
            playlistId, playlistName,
            name: pending.name, logo: pending.logo, group: pending.group,
            url: line
          });
          pending = null;
        } else {
          channels.push({
            id: playlistId + "_" + channels.length,
            playlistId, playlistName,
            name: "Channel " + (channels.length+1), logo:"", group:"General",
            url: line
          });
        }
      }
    }
    return channels;
  }

  function rebuildChannelIndex(){
    allChannels = [];
    playlists.forEach(p => { allChannels = allChannels.concat(p.channels); });
    renderCategories();
    renderGrid();
    renderPlaylistManager();
    toggleEmptyStates();
  }

  function toggleEmptyStates(){
    const has = allChannels.length > 0;
    document.getElementById("globalEmpty").classList.toggle("hidden", has);
    document.getElementById("channelSection").classList.toggle("hidden", !has);
    document.getElementById("categories").classList.toggle("hidden", !has);
    document.getElementById("fab").classList.toggle("hidden", !has);
  }

  // ---------- Rendering ----------
  function renderCategories(){
    const groups = ["All", ...new Set(allChannels.map(c => c.group))];
    const el = document.getElementById("categories");
    el.innerHTML = "";
    groups.forEach(g => {
      const pill = document.createElement("div");
      pill.className = "pill" + (g === activeGroup ? " active" : "");
      pill.textContent = g;
      pill.onclick = () => { activeGroup = g; renderCategories(); renderGrid(); };
      el.appendChild(pill);
    });
  }

  function renderGrid(query){
    const grid = document.getElementById("grid");
    const q = (document.getElementById("search").value || "").toLowerCase();
    grid.innerHTML = "";

    const list = allChannels.filter(c => {
      const inGroup = activeGroup === "All" || c.group === activeGroup;
      const inSearch = !q || c.name.toLowerCase().includes(q);
      return inGroup && inSearch;
    });

    document.getElementById("sectionTitle").textContent =
      activeGroup === "All" ? "All channels (" + list.length + ")" : activeGroup + " (" + list.length + ")";

    list.forEach(ch => {
      const card = document.createElement("div");
      card.className = "card" + (currentChannel && currentChannel.id === ch.id ? " playing" : "");
      card.innerHTML = `
        <div class="logo">${ch.logo ? `<img src="${escapeAttr(ch.logo)}" onerror="this.parentElement.innerHTML='<span class=fallback>${initials(ch.name)}</span>'" />` : `<span class="fallback">${initials(ch.name)}</span>`}</div>
        <div class="channel-name">${escapeHtml(ch.name)}</div>
      `;
      card.onclick = () => playChannel(ch);
      grid.appendChild(card);
    });
  }

  function initials(name){
    return (name || "?").trim().slice(0,2).toUpperCase();
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // ---------- Player ----------
  const video = document.getElementById("video");
  const statusOverlay = document.getElementById("statusOverlay");
  const statusSpinner = document.getElementById("statusSpinner");
  const statusErrIcon = document.getElementById("statusErrIcon");
  const statusTitle = document.getElementById("statusTitle");
  const statusMsg = document.getElementById("statusMsg");
  const retryBtn = document.getElementById("retryBtn");
  const playerEmpty = document.getElementById("playerEmpty");

  function showConnecting(){
    playerEmpty.classList.add("hidden");
    statusOverlay.classList.remove("hidden");
    statusSpinner.classList.remove("hidden");
    statusErrIcon.classList.add("hidden");
    statusTitle.classList.add("hidden");
    retryBtn.classList.add("hidden");
    statusMsg.textContent = "Connecting to stream…";
  }
  function showPlaying(){
    statusOverlay.classList.add("hidden");
  }
  function showError(title, detail){
    playerEmpty.classList.add("hidden");
    statusOverlay.classList.remove("hidden");
    statusSpinner.classList.add("hidden");
    statusErrIcon.classList.remove("hidden");
    statusTitle.classList.remove("hidden");
    statusTitle.textContent = title;
    statusMsg.textContent = detail || "";
    retryBtn.classList.remove("hidden");
  }

  function playChannel(channel){
    currentChannel = channel;
    retryCount = 0;
    document.getElementById("nowPlaying").classList.remove("hidden");
    document.getElementById("npName").textContent = channel.name;
    document.getElementById("npGroup").textContent = channel.group + " · " + channel.playlistName;
    document.getElementById("npLogo").src = channel.logo || "";
    document.getElementById("npLogo").onerror = function(){ this.style.visibility = "hidden"; };
    document.getElementById("npLogo").style.visibility = "visible";
    renderGrid();
    loadSource(channel.url);
  }

  function loadSource(url){
    showConnecting();
    const proxied = PROXY + encodeURIComponent(url);

    if(hls){ hls.destroy(); hls = null; }

    // 12s hard timeout: if MANIFEST_PARSED hasn't fired by then, surface an error
    let timedOut = false;
    const timeoutId = setTimeout(() => {
      timedOut = true;
      showError("Stream timed out", "The channel didn't respond in time. It may be offline.");
    }, 15000);

    if(Hls.isSupported()){
      hls = new Hls({
        enableWorker: true,
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 10,
        manifestLoadingTimeOut: 12000,
        manifestLoadingMaxRetry: 2,
        levelLoadingTimeOut: 12000,
        fragLoadingTimeOut: 15000,
      });
      hls.loadSource(proxied);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        clearTimeout(timeoutId);
        if(timedOut) return;
        video.play().catch(()=>{});
      });

      video.addEventListener("playing", () => { showPlaying(); }, { once: false });

      hls.on(Hls.Events.ERROR, (event, data) => {
        console.warn("HLS error:", data.type, data.details, data);
        if(!data.fatal) return;
        clearTimeout(timeoutId);

        if(retryCount < MAX_RETRIES && (data.type === Hls.ErrorTypes.NETWORK_ERROR)){
          retryCount++;
          statusMsg.textContent = "Reconnecting… (" + retryCount + "/" + MAX_RETRIES + ")";
          setTimeout(() => {
            hls.startLoad();
          }, 1000 * retryCount);
          return;
        }

        switch(data.type){
          case Hls.ErrorTypes.NETWORK_ERROR:
            showError("Channel unavailable", "Network error loading the stream (" + (data.details||"") + ").");
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            statusMsg.textContent = "Recovering playback…";
            hls.recoverMediaError();
            break;
          default:
            showError("Channel unavailable", data.details || "Unknown playback error.");
            hls.destroy();
        }
      });
    } else if(video.canPlayType("application/vnd.apple.mpegurl")){
      // Native HLS (Safari)
      video.src = proxied;
      video.addEventListener("loadedmetadata", () => {
        clearTimeout(timeoutId);
        if(timedOut) return;
        video.play().catch(()=>{});
      }, { once: true });
      video.addEventListener("playing", () => showPlaying());
      video.addEventListener("error", () => {
        clearTimeout(timeoutId);
        showError("Channel unavailable", "This stream could not be loaded.");
      });
    } else {
      clearTimeout(timeoutId);
      showError("Unsupported", "This browser can't play HLS streams.");
    }
  }

  retryBtn.onclick = () => {
    if(currentChannel) loadSource(currentChannel.url);
  };

  // ---------- Search ----------
  document.getElementById("search").addEventListener("input", () => renderGrid());

  // ---------- Modal ----------
  const modalBackdrop = document.getElementById("modalBackdrop");
  function openModal(tab){
    modalBackdrop.classList.remove("hidden");
    setTab(tab || "url");
  }
  function closeModal(){
    modalBackdrop.classList.add("hidden");
    document.getElementById("urlError").textContent = "";
    document.getElementById("pasteError").textContent = "";
    document.getElementById("urlName").value = "";
    document.getElementById("urlLink").value = "";
    document.getElementById("pasteName").value = "";
    document.getElementById("pasteText").value = "";
  }
  function setTab(name){
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
    document.getElementById("tabUrl").classList.toggle("hidden", name !== "url");
    document.getElementById("tabPaste").classList.toggle("hidden", name !== "paste");
    document.getElementById("tabManage").classList.toggle("hidden", name !== "manage");
  }
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => setTab(t.dataset.tab));

  document.getElementById("manageBtn").onclick = () => openModal("manage");
  document.getElementById("fab").onclick = () => openModal("url");
  document.getElementById("emptyAddBtn").onclick = () => openModal("url");
  document.getElementById("cancelUrl").onclick = closeModal;
  document.getElementById("cancelPaste").onclick = closeModal;
  document.getElementById("closeManage").onclick = closeModal;
  modalBackdrop.addEventListener("click", (e) => { if(e.target === modalBackdrop) closeModal(); });

  function addPlaylist(name, channels){
    const id = "pl_" + Date.now();
    channels.forEach((c,i) => { c.id = id + "_" + i; c.playlistId = id; c.playlistName = name; });
    playlists.push({ id, name, channels });
    savePlaylists();
    rebuildChannelIndex();
  }

  document.getElementById("saveUrl").onclick = async () => {
    const name = document.getElementById("urlName").value.trim() || "Playlist";
    const link = document.getElementById("urlLink").value.trim();
    const errEl = document.getElementById("urlError");
    errEl.textContent = "";
    if(!link){ errEl.textContent = "Enter a playlist URL."; return; }

    const btn = document.getElementById("saveUrl");
    btn.textContent = "Loading…"; btn.disabled = true;

    try{
      const res = await fetch(PROXY + encodeURIComponent(link));
      if(!res.ok) throw new Error("Server returned " + res.status);
      const text = await res.text();
      const channels = parseM3U(text, "tmp", name);
      if(channels.length === 0) throw new Error("No channels found in this playlist.");
      addPlaylist(name, channels);
      closeModal();
    }catch(e){
      errEl.textContent = "Couldn't load playlist: " + e.message;
    }finally{
      btn.textContent = "Load playlist"; btn.disabled = false;
    }
  };

  document.getElementById("savePaste").onclick = () => {
    const name = document.getElementById("pasteName").value.trim() || "Playlist";
    const text = document.getElementById("pasteText").value.trim();
    const errEl = document.getElementById("pasteError");
    errEl.textContent = "";
    if(!text){ errEl.textContent = "Paste playlist contents."; return; }
    const channels = parseM3U(text, "tmp", name);
    if(channels.length === 0){ errEl.textContent = "No channels found in this text."; return; }
    addPlaylist(name, channels);
    closeModal();
  };

  function renderPlaylistManager(){
    const el = document.getElementById("playlistList");
    el.innerHTML = "";
    if(playlists.length === 0){
      el.innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;">No playlists added yet.</p>';
      return;
    }
    playlists.forEach(p => {
      const row = document.createElement("div");
      row.className = "playlist-row";
      row.innerHTML = `
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pcount">${p.channels.length} ch</div>
        <button class="del-btn" aria-label="Remove playlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      `;
      row.querySelector(".del-btn").onclick = () => {
        playlists = playlists.filter(pl => pl.id !== p.id);
        savePlaylists();
        rebuildChannelIndex();
      };
      el.appendChild(row);
    });
  }

  // ---------- Init ----------
  rebuildChannelIndex();
})();
</script>
</body>
</html>
